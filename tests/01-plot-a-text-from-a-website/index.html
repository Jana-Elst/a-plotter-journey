<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plot a text from a website</title>

    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="https://use.typekit.net/zdi1wmd.css">

    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/style.css">
</head>


<body>
    <div class="container">
        <div class="header">
            <h1>Let's plot</h1>
            <p class="subheading">from a website</p>
        </div>

        <div class="textToPlot">
            <p>&lt;p&gt; Hello World! &lt;/p&gt;</p>
        </div>
 
        <button class="button" id="buttonPlotText">Plot text</button>

        <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
        <script src="scripts/script.js"></script>
    </div>
</body>

</html>
